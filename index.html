<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DVHOST CLOUD | دانلود v2rayNG</title>
    <!-- فونت Vazirmatn -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap">
    <!-- فونت آیکون Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root{color-scheme:dark;--primary-color:#38bdf8;--primary-hover:#7dd3fc;--secondary-color:#122033;--text-color:#e7eef8;--light-text:#93a4bb;--success-color:#34d399;--danger-color:#fb7185;--border-radius:20px;--shadow:0 24px 90px #0006}
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Vazirmatn',system-ui,sans-serif;background:#070d17;color:var(--text-color);line-height:1.8;min-height:100vh;padding:40px 16px;background-image:radial-gradient(ellipse at 12% 5%,#07598545,transparent 45%),radial-gradient(ellipse at 90% 50%,#164e6335,transparent 50%)}
        body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(#ffffff03 1px,transparent 1px),linear-gradient(90deg,#ffffff03 1px,transparent 1px);background-size:48px 48px}
        .container{position:relative;width:100%;max-width:720px;margin:auto}
        .brand-bar{display:flex;direction:ltr;align-items:center;justify-content:space-between;gap:12px;margin:0 6px 24px}
        .brand-lockup{display:flex;align-items:center;gap:12px}
        .brand-mark{width:46px;height:46px;display:grid;place-items:center;background:linear-gradient(135deg,#38bdf8,#2dd4bf);border-radius:14px;color:#082032;font-weight:900;font-size:23px;box-shadow:0 0 30px #38bdf826}
        .brand-name{font-size:18px;letter-spacing:2px;font-weight:700;color:#f1f5f9}
        .brand-subtitle{font-size:10px;color:var(--light-text);letter-spacing:2px}
        .brand-status{font-size:11px;color:#a7d9e9;border:1px solid #38bdf82b;border-radius:99px;padding:5px 10px;white-space:nowrap}
        .brand-status::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#2dd4bf;margin-right:7px}
        .card{background:linear-gradient(155deg,#121e30ee,#0c1423f5);border:1px solid #28364a;border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
        .card-header{padding:34px 24px 28px;text-align:center;border-bottom:1px solid #ffffff0d;background:radial-gradient(ellipse at top,#38bdf811,transparent 75%)}
        .eyebrow{display:inline-block;color:#67e8f9;font-size:10px;letter-spacing:3px;font-weight:700;margin-bottom:12px}
        .card-header h1{font-size:clamp(22px,4vw,29px);font-weight:700;display:flex;align-items:center;justify-content:center;gap:12px;color:#f8fafc}
        .card-header h1 i{color:#38bdf8;font-size:24px}
        .hero-copy{color:var(--light-text);font-size:13px;margin-top:10px}
        .card-body{padding:28px}
        .text-center{text-align:center}
        .version-badge{display:inline-flex;align-items:center;gap:10px;background:#38bdf80d;color:#bce9ff;border:1px solid #38bdf82b;padding:8px 20px;border-radius:99px;margin-bottom:18px;font-weight:700}
        a{color:#7dd3fc;text-decoration:none;transition:color .2s}
        a:hover{color:#a5f3fc}
        .download-btn{display:flex;align-items:center;justify-content:center;gap:10px;max-width:360px;width:100%;margin:20px auto 14px;padding:15px 22px;border:0;border-radius:14px;background:linear-gradient(110deg,#0284c7,#0891b2);box-shadow:0 8px 28px #0284c72b;color:white;font-weight:700;font-size:16px;text-decoration:none;transition:transform .2s,box-shadow .2s}
        .download-btn::before{content:"↓";font-size:22px}
        .download-btn:hover{color:white;transform:translateY(-2px);box-shadow:0 12px 35px #0284c744}
        .countdown{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:7px;font-size:12px;color:var(--light-text);margin-bottom:20px}
        .countdown span{color:#67e8f9;font-weight:700}
        .cancel-btn{font:inherit;color:#cbd5e1;background:#ffffff05;border:1px solid #ffffff1a;border-radius:8px;padding:3px 12px;cursor:pointer}
        .cancel-btn:hover{background:#ffffff0c}
        .release-details{margin:16px 0;border:1px solid #ffffff12;border-radius:14px;background:#080f1c33;overflow:hidden}
        .release-details summary{cursor:pointer;padding:15px 18px;color:#d9e6f6;font-weight:500;font-size:14px}
        .release-details summary::marker{color:#38bdf8}
        .release-details[open]>summary{border-bottom:1px solid #ffffff0a;background:#ffffff03}
        .asset-list{padding:14px;display:grid;gap:10px}
        .asset-link{display:block;padding:14px 16px;border:1px solid #ffffff0d;border-radius:11px;background:linear-gradient(110deg,#15273b,#111d2e);transition:border-color .2s,transform .2s}
        .asset-link:hover{border-color:#38bdf860;transform:translateY(-1px)}
        .asset-link strong{display:block;color:#d5eafa;font-size:13px;font-weight:500}
        .asset-link small{display:block;font-size:11px;overflow-wrap:anywhere;color:var(--light-text);margin-top:6px}
        .update-section{padding:16px 18px;border:1px solid #38bdf82b;border-radius:14px;background:#38bdf808;color:#b8d7eb;font-size:13px;margin-bottom:20px}
        .accordion-body{padding:18px;font-size:12px;line-height:1.9;white-space:pre-line;direction:ltr;overflow-wrap:anywhere;max-height:400px;overflow-y:auto;color:#aebed2}
        .beta-badge{display:inline-block;color:#fcd34d;background:#f59e0b15;border:1px solid #f59e0b30;border-radius:99px;padding:2px 8px;font-size:10px;margin:0 6px}
        .version-date{font-size:11px;color:var(--light-text);margin-right:10px;direction:ltr;display:inline-block}
        .checkbox-container{display:flex;align-items:center;gap:8px;padding:14px 18px;font-size:12px;color:var(--light-text)}
        .checkbox-input{accent-color:#0ea5e9;width:16px;height:16px}
        #versionsList{padding:0 12px 10px}
        .alert{padding:16px;border-radius:12px;text-align:center;margin-bottom:16px;font-size:13px}
        .alert-danger{color:#fda4af;background:#fb71850a;border:1px solid #fb71852b}
        .loading{display:flex;align-items:center;flex-direction:column;padding:40px 0;gap:16px;color:var(--light-text);font-size:13px}
        .spinner{width:36px;height:36px;border:3px solid #38bdf826;border-top-color:#38bdf8;border-radius:50%;animation:spin .8s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        .card-footer{padding:20px 24px;border-top:1px solid #ffffff0d;background:#060c1733;text-align:center;color:var(--light-text);font-size:11px}
        .footer-brand{font-weight:700;letter-spacing:1px;margin-bottom:5px;font-size:12px}
        .card-body>.text-center:last-child{margin-top:22px;font-size:12px}
        [hidden]{display:none!important}
        a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid #67e8f9;outline-offset:4px}
        @media(max-width:480px){body{padding:24px 12px}.brand-status{font-size:9px;padding:4px 8px}.brand-name{font-size:15px}.brand-subtitle{font-size:8px}.brand-mark{width:40px;height:40px}.card-body{padding:18px}.card-header{padding:26px 16px}.asset-link{padding:12px}.version-date{display:block;margin:5px 0 0}.card{border-radius:20px}}
        @media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}.download-btn:hover,.asset-link:hover{transform:none}}
    </style>
</head>

<body>
    <div class="container">
        <div class="brand-bar">
            <a class="brand-lockup" href="https://t.me/dvhost_cloud" aria-label="کانال DVHOST CLOUD">
                <span class="brand-mark" aria-hidden="true">D</span>
                <span><span class="brand-name">DVHOST CLOUD</span><br><span class="brand-subtitle">TOOLS &amp; DOWNLOADS</span></span>
            </a>
            <span class="brand-status">GITHUB RELEASES</span>
        </div>
        <div class="card">
            <div class="card-header">
                <span class="eyebrow" dir="ltr">V2RAYNG DOWNLOAD CENTER</span>
                <h1><i class="fas fa-arrow-down" aria-hidden="true"></i>دانلود v2rayNG</h1>
                <p class="hero-copy">نسخه مناسب دستگاهت را مستقیم از GitHub دریافت کن.</p>
            </div>
            <div class="card-body" id="content">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>در حال دریافت اطلاعات از GitHub...</p>
                </div>
            </div>
            <div class="card-footer">
                <div class="footer-brand"><a href="https://t.me/dvhost_cloud" dir="ltr">DVHOST CLOUD ↗</a></div>
                <div>این صفحه آخرین نسخه را از <a
                        href="https://github.com/2dust/v2rayNG/releases" target="_blank">صفحه ریلیزهای GitHub</a> دریافت
                    می‌کند</div>
            </div>
        </div>
    </div>

    <script>
        const API = 'https://api.github.com/repos/2dust/v2rayNG';
        let countdownTimer = null;

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, char =>
                ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[char]));
        }

        function safeUrl(value) {
            try {
                const url = new URL(value);
                return url.protocol === 'https:' && url.hostname === 'github.com'
                    ? escapeHtml(url.href) : '';
            } catch {
                return '';
            }
        }

        function getApkAssets(release) {
            const order = ['universal', 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86', 'other'];
            return (release.assets || []).filter(asset =>
                /\.apk$/i.test(asset.name || '') && safeUrl(asset.browser_download_url)
            ).map(asset => {
                const name = asset.name.toLowerCase();
                const architecture = order.slice(0, -1).find(arch =>
                    new RegExp('(?:^|[_-])' + arch + '\\.apk$', 'i').test(name)
                ) || 'other';
                return {...asset, architecture, fdroid: /(?:^|[_-])fdroid(?:[_-]|\.)/i.test(name)};
            }).sort((a, b) => Number(a.fdroid) - Number(b.fdroid)
                || order.indexOf(a.architecture) - order.indexOf(b.architecture)
                || a.name.localeCompare(b.name));
        }

        function getUniversalAsset(release) {
            return getApkAssets(release).find(asset =>
                asset.architecture === 'universal' && !asset.fdroid);
        }

        function assetLabel(asset) {
            const labels = {
                universal: 'Universal — مناسب همه معماری‌ها',
                'arm64-v8a': 'ARM64 — بیشتر گوشی‌های جدید',
                'armeabi-v7a': 'ARM32 — گوشی‌های قدیمی ۳۲ بیتی',
                x86_64: 'x86_64 — دستگاه یا شبیه‌ساز ۶۴ بیتی Intel',
                x86: 'x86 — دستگاه یا شبیه‌ساز ۳۲ بیتی Intel',
                other: asset.name
            };
            return labels[asset.architecture] + (asset.fdroid ? ' · F-Droid' : '');
        }

        function renderAssetList(release) {
            const assets = getApkAssets(release);
            if (!assets.length) {
                return '<p class="alert alert-danger">فایل APK در این نسخه موجود نیست.</p>';
            }
            return '<div class="asset-list">' + assets.map(asset => {
                const size = Number(asset.size) > 0
                    ? (asset.size / 1024 / 1024).toFixed(1) + ' MB' : '';
                return `<a class="asset-link" href="${safeUrl(asset.browser_download_url)}">
                    <strong>${escapeHtml(assetLabel(asset))}</strong>
                    <small dir="ltr">${escapeHtml(asset.name)}${size ? ' · ' + size : ''}</small>
                </a>`;
            }).join('') + '</div>';
        }

        function renderNotes(release) {
            if (!release.body) return '';
            return `<details class="release-details">
                <summary>تغییرات نسخه ${escapeHtml(release.tag_name)}</summary>
                <div class="accordion-body">${escapeHtml(release.body)}</div>
            </details>`;
        }

        function stopCountdown() {
            if (countdownTimer !== null) {
                clearInterval(countdownTimer);
                countdownTimer = null;
            }
            const element = document.getElementById('autoDownload');
            if (element) element.hidden = true;
        }

        function startCountdown(url) {
            stopCountdown();
            const element = document.getElementById('autoDownload');
            if (!element || !safeUrl(url)) return;
            element.hidden = false;
            let seconds = 10;
            countdownTimer = setInterval(() => {
                const counter = document.getElementById('countdown');
                if (!counter) return stopCountdown();
                counter.textContent = --seconds;
                if (seconds <= 0) {
                    stopCountdown();
                    window.location.href = url;
                }
            }, 1000);
        }

        function renderRelease(release, requested = false) {
            stopCountdown();
            const universal = getUniversalAsset(release);
            const beta = release.prerelease ? '<span class="beta-badge">آزمایشی</span>' : '';
            const notice = universal
                ? '<p class="text-center">نسخه Universal روی همه معماری‌ها قابل نصب است.</p>'
                : '<div class="update-section">این نسخه Universal معمولی ندارد؛ فایل مناسب دستگاه خود را انتخاب کنید. اگر معماری را نمی‌دانید، آن را در مشخصات دستگاه یا برنامه‌ای مثل CPU-Z بررسی کنید.</div>';
            document.getElementById('content').innerHTML = `
                <div class="text-center"><div class="version-badge">
                    نسخه ${escapeHtml(release.tag_name)} ${beta}
                </div></div>
                ${notice}
                ${universal ? `<a id="downloadBtn" class="download-btn" href="${safeUrl(universal.browser_download_url)}">دانلود Universal</a>
                    <div id="autoDownload" class="countdown" hidden>
                        دانلود خودکار در <span id="countdown">10</span> ثانیه
                        <button type="button" id="cancelDownload" class="cancel-btn">لغو</button>
                    </div>` : ''}
                <details class="release-details" id="assetChoices" ${universal ? '' : 'open'}>
                    <summary>فایل‌های قابل دانلود این نسخه</summary>
                    ${renderAssetList(release)}
                </details>
                ${renderNotes(release)}
                ${requested ? '<p class="text-center"><a href="' + escapeHtml(window.location.pathname) + '">بازگشت به آخرین نسخه پایدار</a></p>' : `
                    <details class="release-details" id="history">
                        <summary>نسخه‌های قبلی و آزمایشی</summary>
                        <div class="checkbox-container">
                            <input type="checkbox" id="showBeta" class="checkbox-input">
                            <label for="showBeta">نمایش نسخه‌های آزمایشی</label>
                        </div>
                        <div id="versionsList">در حال دریافت نسخه‌ها...</div>
                    </details>`}
                <p class="text-center"><a href="https://github.com/2dust/v2rayNG/releases" target="_blank" rel="noopener">همه نسخه‌ها در GitHub</a></p>
            `;
            document.getElementById('cancelDownload')?.addEventListener('click', stopCountdown);
            document.getElementById('assetChoices').addEventListener('toggle', event => {
                if (event.target.open) stopCountdown();
            });
            document.getElementById('content').querySelectorAll('a').forEach(link =>
                link.addEventListener('click', stopCountdown));
            document.getElementById('history')?.addEventListener('toggle', event => {
                if (event.target.open) stopCountdown();
            });
            if (universal) startCountdown(universal.browser_download_url);
        }

        function generateVersionList(releases, includeBeta = false) {
            const seen = new Set();
            const visible = releases.filter(release => {
                if (release.draft || (!includeBeta && release.prerelease)
                    || seen.has(release.tag_name)) return false;
                seen.add(release.tag_name);
                return true;
            });
            return visible.map(release => {
                const date = new Date(release.published_at);
                const dateLabel = Number.isNaN(date.getTime()) ? '' : date.toLocaleDateString('fa-IR');
                return `<details class="release-details">
                    <summary><span dir="ltr">${escapeHtml(release.tag_name)}</span>
                        ${release.prerelease ? '<span class="beta-badge">آزمایشی</span>' : ''}
                        <span class="version-date">${escapeHtml(dateLabel)}</span>
                    </summary>
                    ${renderAssetList(release)}
                </details>`;
            }).join('') || '<p class="text-center">نسخه‌ای برای نمایش موجود نیست.</p>';
        }

        let backupPromise = null;
        let backupUpdatedAt = null;

        async function requestJson(url, timeout = 5000) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeout);
            try {
                // Simple GET avoids an unnecessary CORS preflight.
                const response = await fetch(url, {signal: controller.signal});
                if (!response.ok) {
                    const error = new Error(response.status === 404
                        ? 'نسخه درخواستی پیدا نشد.'
                        : 'دریافت اطلاعات آنلاین ممکن نیست.');
                    error.status = response.status;
                    throw error;
                }
                return await response.json();
            } finally {
                clearTimeout(timer);
            }
        }

        function loadBackup() {
            if (!backupPromise) {
                backupPromise = (async () => {
                    // Raw serves the daily refreshed snapshot even if Pages has not rebuilt yet.
                    try {
                        return await requestJson('https://raw.githubusercontent.com/dev-ir/v2rayNG-Auto-Downloader/master/releases-cache.json', 3000);
                    } catch {
                        return requestJson('./releases-cache.json', 5000);
                    }
                })().catch(error => {
                    backupPromise = null;
                    throw error;
                });
            }
            return backupPromise;
        }

        async function fetchJson(path) {
            try {
                return await requestJson(API + path);
            } catch (onlineError) {
                let backup;
                try {
                    backup = await loadBackup();
                } catch {
                    throw new Error('دریافت اطلاعات ممکن نیست؛ اتصال اینترنت را بررسی کنید یا از لینک GitHub دانلود کنید.');
                }
                let result;
                if (path === '/releases/latest') {
                    result = backup.latest;
                } else if (path.startsWith('/releases?')) {
                    result = backup.releases;
                } else if (path.startsWith('/releases/tags/')) {
                    const tag = decodeURIComponent(path.slice('/releases/tags/'.length));
                    result = [backup.latest, ...(backup.releases || [])].find(release => release?.tag_name === tag);
                }
                if (!result) throw onlineError;
                backupUpdatedAt = backup.updated_at;
                return result;
            }
        }

        function showBackupNotice() {
            if (!backupUpdatedAt || document.getElementById('backupNotice')) return;
            const notice = document.createElement('p');
            notice.id = 'backupNotice';
            notice.className = 'update-section';
            const date = new Date(backupUpdatedAt).toLocaleString('fa-IR');
            notice.textContent = 'ارتباط با API برقرار نشد؛ اطلاعات پشتیبان نمایش داده می‌شود. آخرین به‌روزرسانی: ' + date;
            document.getElementById('content').prepend(notice);
            // A cached version should require an explicit download click.
            stopCountdown();
        }

        async function fetchRequestedRelease(version) {
            // Match full tags only, including versions outside the history page.
            const candidates = [version, /^v/i.test(version) ? version.slice(1) : 'v' + version];
            for (const tag of candidates) {
                try {
                    return await fetchJson('/releases/tags/' + encodeURIComponent(tag));
                } catch (error) {
                    if (error.status !== 404) throw error;
                }
            }
            throw new Error('نسخه درخواستی پیدا نشد.');
        }

        async function fetchReleases() {
            stopCountdown();
            backupUpdatedAt = null;
            try {
                const requested = new URLSearchParams(window.location.search).get('version');
                const release = requested
                    ? await fetchRequestedRelease(requested)
                    : await fetchJson('/releases/latest');
                renderRelease(release, Boolean(requested));
                showBackupNotice();
                if (requested) return;
                // History failures must not hide the current release's downloads.
                try {
                    const releases = await fetchJson('/releases?per_page=100');
                    const renderHistory = () => {
                        document.getElementById('versionsList').innerHTML =
                            generateVersionList(releases, document.getElementById('showBeta').checked);
                    };
                    document.getElementById('showBeta').addEventListener('change', () => {
                        stopCountdown();
                        renderHistory();
                    });
                    renderHistory();
                    showBackupNotice();
                } catch (error) {
                    document.getElementById('versionsList').textContent = error.message;
                }
            } catch (error) {
                document.getElementById('content').innerHTML = `
                    <div class="alert alert-danger">${escapeHtml(error.message)}</div>
                    <p class="text-center"><a href="${escapeHtml(window.location.pathname)}">تلاش دوباره / صفحه اصلی</a></p>
                    <p class="text-center"><a href="https://github.com/2dust/v2rayNG/releases">دانلود از GitHub</a></p>`;
            }
        }

        document.addEventListener('DOMContentLoaded', fetchReleases);
    </script>
</body>
</html>
